name: Build

on:
  push:
    branches: [64-bit-version]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build -j 4 -- -k 2>&1 | tee build-macos.log
      - name: Check architectures
        if: always()
        run: |
          ls package/LitterPower/externals | wc -l
          lipo -archs "package/LitterPower/externals/lp.shhh~.mxo/Contents/MacOS/lp.shhh~" || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos
          path: build-macos.log
      - name: Zip externals
        # zip here so that symlinks and permissions inside the .mxo bundles survive
        run: cd package && zip -qry ../LitterPower-macos.zip LitterPower
      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: LitterPower-macos
          path: LitterPower-macos.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        shell: bash
        run: cmake --build build --config Release -- -m -clp:ErrorsOnly\;Summary -flp1:warningsonly\;logfile=build-windows-warnings.log 2>&1 | tee build-windows.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: |
            build-windows.log
            build/build-windows-warnings.log
      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: LitterPower-windows
          path: package

  package:
    name: Max package
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LitterPower-macos
          path: macos
      - uses: actions/download-artifact@v4
        with:
          name: LitterPower-windows
          path: package
      - name: Assemble package
        run: |
          mkdir -p package && unzip -q macos/LitterPower-macos.zip -d package
          python3 tools/make_package.py
          ls package/LitterPower/externals | wc -l
          # zip here so that file permissions inside the .mxo bundles survive
          cd package && zip -qry ../LitterPower.zip LitterPower
      - uses: actions/upload-artifact@v4
        with:
          name: LitterPower-package
          path: LitterPower.zip
